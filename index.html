<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#394cc5" />
  <meta name="description" content="ENAL OS — daily tasks, finances, bills, ideas, and Velora game plan in one private, offline-friendly dashboard." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>ENAL OS — Personal Command Center</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">E</span><span><strong>ENAL OS</strong><small>Personal Command Center</small></span></div>
      <div class="side-caption">WORKSPACE</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="side-bottom"><span class="local-dot"></span> Local-first • Your data stays here <small>Version 2.0</small></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">E</span><strong>ENAL OS</strong></div>
        <div class="topbar-left"><span class="eyebrow">PERSONAL COMMAND CENTER</span><h1 id="page-title">Dashboard</h1></div>
        <div class="topbar-right"><span id="save-status" class="save-status" role="status" aria-live="polite">Save time unknown</span><span id="today-date" class="today-date"></span><button id="quick-add" class="btn btn-primary" type="button">＋ <span>Quick add</span></button><button id="more-button" class="btn icon-btn mobile-only" type="button" aria-label="All sections">☰</button></div>
      </header>
      <main id="page" class="page" tabindex="-1"></main>
    </div>
    <button id="mobile-capture" class="mobile-capture" type="button" aria-label="Quick capture income expenses or tasks" title="Quick capture">＋ <span>Quick capture</span></button>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Quick navigation"></nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
